# ============================================================
#  servicio-agente-triaje — AI agent, tool calling, resilience
# ============================================================

llm:
  proveedor: anthropic
  modelo: ${LLM_MODELO:claude-opus-5-5}
  timeout-segundos: 60
  umbral-confianza: 0.7             # RN-04 (applied by servicio-tickets)
  # Triage is a classification task: low effort keeps cost and latency down.
  esfuerzo: low
  # Thinking is always on with current models: leave room for it.
  max-tokens: 16000

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:triageai}
    username: ${POSTGRES_USER:triageai}
    password: ${POSTGRES_PASSWORD:triageai}
  ai:
    anthropic:
      # Without a key the service still starts: calls fail with 401, the
      # circuit opens and tickets get the rule-based triage (RN-06).
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      timeout: ${llm.timeout-segundos}s
      # Retries are owned by Resilience4j below, not by the SDK.
      max-retries: 0

agente:
  consumidor:
    grupo: triaje                   # consumer group (README section 7.3)
  # HU-08 — automatic retry of tickets left in PENDIENTE_TRIAJE
  reintento:
    max-intentos: 5
    frecuencia-ms: 300000
  # Same text within this window reuses the previous triage (e.g. mass outage)
  cache:
    ttl: PT1H

# RN-06 — bounded retry + circuit breaker around the Anthropic call
resilience4j:
  circuitbreaker:
    instances:
      anthropic:
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
  retry:
    instances:
      anthropic:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
