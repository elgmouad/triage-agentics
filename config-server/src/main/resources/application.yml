server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # "native" reads plain files from a folder (config-repo/, mounted as a
    # volume in Docker). Set SPRING_PROFILES_ACTIVE=git and CONFIG_GIT_URI
    # to read the same files from a remote Git repository instead.
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:../config-repo}
        git:
          uri: ${CONFIG_GIT_URI:}
          default-label: ${CONFIG_GIT_LABEL:main}
          search-paths: config-repo
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
